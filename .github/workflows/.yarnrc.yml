name: Deploy Complexe La Providence

on:
  push:
    branches:
      - main
      - master

jobs:
  build_project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. خطوة فك الضغط (يبحث عن ملف اسمه project.zip)
    - name: Unzip Project Files
      run: |
        echo "=== جاري فك ضغط ملف المشروع ==="
        if [ -f "project.zip" ]; then
          unzip -o project.zip -d ./
          echo "تم فك الضغط بنجاح!"
          ls -la
        else
          echo "خطأ: لم يتم العثور على ملف project.zip في المستودع."
          exit 1
        fi

    # 2. تجهيز بيئة تشغيل Node.js
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # 3. تجهيز أداة Expo EAS لعمل الـ Build
    - name: Setup Expo EAS CLI
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    # 4. تثبيت مكتبات المشروع المكتوبة في package.json
    - name: Install Dependencies
      run: |
        echo "=== جاري تثبيت الحزم والمكتبات ==="
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi

    # 5. أمر بناء نسخة الـ APK النهائي
    - name: Build Android APK (Preview)
      run: |
        echo "=== جاري بدء عملية بناء الـ APK عبر EAS ==="
        eas build --platform android --profile preview --non-interactive

name: Deploy Complexe La Providence

on:
  push:
    branches:
      - main
      - master

jobs:
  build_project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع
    - name: Unzip Project Files
      run: |
        echo "=== جاري فك ضغط ملف المشروع ==="
        if [ -f "project.zip" ]; then
          unzip -o project.zip -d ./
          echo "تم فك الضغط بنجاح!"
          ls -la
        else
          echo "خطأ: لم يتم العثور على ملف project.zip في المستودع."
          exit 1
        fi

    # 2. تجهيز بيئة تشغيل Node.js (تم تحديث الإصدار لتفادي تحذيرات Deprecated)
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. تجهيز أداة Expo EAS
    - name: Setup Expo EAS CLI
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    # 4. تثبيت الحزم باستخدام Yarn مع تجاهل القيود الصارمة المؤقتة لمنع الفشل
    - name: Install Dependencies via Yarn
      run: |
        echo "=== جاري تثبيت الحزم والمكتبات باستخدام Yarn ==="
        yarn install --immutable || yarn install

    # 5. بناء التطبيق
    - name: Build Android APK (Preview)
      run: |
        echo "=== جاري بدء عملية بناء الـ APK عبر EAS ==="
        eas build --platform android --profile preview --non-interactive
